- q: Combien coûte un projet ?
  a: "Je facture à la journée : 450 € pour le développement web, 550 € en fullstack JavaScript, 600 à 800 € pour les agents IA et le conseil (TVA non applicable). Le devis détaillé suit l'appel découverte."
- q: Les agents IA remplacent-ils le développeur ?
  a: Non. Ils codent, relisent, testent et documentent sous mon contrôle. Je cadre chaque tâche, je relis ce qui est livré et je réponds du résultat.
- q: Travaillez-vous en marque blanche pour les agences ?
  a: Oui. J'interviens sous le nom de votre agence, auprès de vos clients ou uniquement en coulisses, avec vos outils et vos process.
- q: Pouvez-vous reprendre un projet existant ?
  a: Oui, en JavaScript comme en PHP. Je commence par un état des lieux du code, puis je vous dis ce qui peut être gardé, corrigé ou réécrit.
- q: Qu'est-ce qu'un site éco-conçu ?
  a: "Un site qui fait le travail demandé avec le moins de ressources possible : pages légères, peu de scripts, images optimisées, hébergement durable. Il se charge plus vite, ce qui sert aussi votre référencement."
- q: Travaillez-vous à distance ?
  a: Oui, depuis mon van la plupart du temps, entre Aix-en-Provence et la route. Les échanges se font en visio et sur vos outils, y compris en régie pour des ESN.
